name: build-and-release

# Build the patched apt/dpkg on a Debian bookworm container (the pinned
# baseline), smoke-test the packaged artifact in a fresh prefix, and publish it
# as a release. Free on public repos; also the test bed for docs/release.md.
#
#   - manual:  Actions -> build-and-release -> Run workflow (optionally a tag)
#   - tags:    pushing a v* tag builds and releases automatically

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.8.1-1.22.6). Empty = auto."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 120
    steps:
      - name: prepare the container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl gpgv

      - uses: actions/checkout@v4

      - name: build apt/dpkg against the bookworm baseline
        env:
          PREFIX: /root/.local
        run: ./scripts/env/build-on-host.sh

      - name: package the release artifact
        env:
          PREFIX: /root/.local
          SUITE: bookworm
        run: ./scripts/bootstrap/package-prebuilt.sh

      - name: smoke test - install the artifact into a fresh prefix
        run: |
          set -eux
          export PREFIX=/tmp/smoke
          rm -rf "$PREFIX"; mkdir -p "$PREFIX"
          tar -C "$PREFIX" -xzf dist/sudo-less-apt-dpkg-*.tar.gz
          PREFIX="$PREFIX" bash "$PREFIX/share/sudo-less/scripts/setup/install-config.sh" --no-shell
          # test against the pinned baseline suite, not the repo's sid default
          printf 'deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian bookworm main\n' \
            > "$PREFIX/etc/apt/sources.list"
          export PATH="$PREFIX/sbin:$PREFIX/bin:$PREFIX/usr/bin:$PATH"
          export APT_CONFIG="$PREFIX/etc/apt/apt.conf.d/00local-prefix"
          apt-get update
          apt-get install -y tree
          "$PREFIX/usr/bin/tree" --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.buildinfo
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: pick a tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v$(date -u +%Y.%m.%d)-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256 dist/*.buildinfo
