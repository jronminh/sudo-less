# dsb policy for sudo-less: /etc/dsb/conf.d/sudo-less.conf, then
# `dsb-admin apply`. dsb (github.com/jronminh/dsb) runs a command as a bounded
# middle identity, never root; see docs/dsb.md for why these grants and not
# others. Every identity here is safe to hand to the daily user: none can
# write anything root reads.

[global]
callers = master
env     = TERM COLORTERM LANG LANGUAGE LC_*

# `dsb` with no -u: the everyday middle identity from the shipped dsb.conf
# (a shell, any command, own home, nothing else writable).

# A fresh, empty, unprivileged account: test the supported install path the
# way a new user meets it, without master's ~/.local, PATH or dotfiles.
#   dsb -u sl-fresh -p bootstrap.sh bash
#   dsb -u sl-fresh -i          # then apt-get install ...
#   dsb -u sl-fresh -c 'rm -rf ~/.local ~/.cache ~/.profile'   # reset
[identity sl-fresh]
shell    = yes
commands = *
namespaces = yes     # prefix-run.sh's overlay tiers use bwrap/unshare

# Read the system journal (admin/*.sh effects, system units, Waydroid,
# dsb's own audit trail) without putting master in a log group.
#   dsb -u sl-journal journalctl -b -u waydroid-container
[identity sl-journal]
groups   = systemd-journal
commands = /usr/bin/journalctl
edit     = no
network  = no
jit      = no
