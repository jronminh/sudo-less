# /etc/updo/updo.conf: who may act as which updo identity, and how.
# Also read: /etc/updo/conf.d/*.conf (handy for one identity per file).
#
# Nothing is enabled until an identity has callers. After every edit:
#   updo-admin apply      (validates first; a bad file changes nothing)
#
# [global] callers, env, timeout: defaults for every identity
# [identity NAME]         socket /run/updo/NAME.sock, used as updo -u NAME
#   user     = updo-NAME  system user, created on apply ("updo" for [identity
#                         updo]); an existing user; or "dynamic" for a new
#                         uid per call (no shell then)
#   callers  =            users allowed to call it (never root)
#   shell    = no         yes: interactive shell, -s, -i, -c, -f
#   edit     = yes        no: updo -e refused
#   commands = *          absolute paths it may execute, or * for anything;
#                         checked by updod and by the kernel (ExecPaths=), so
#                         a shell or script cannot reach past the list
#   write    =            paths it may write, besides its home and /tmp
#   groups   =            supplementary groups (root-equivalent ones refused)
#   caps     =            ambient capabilities, from a short allowlist
#   env      =            caller variables let through; NAME* is a prefix
#   timeout  = 0          seconds before TERM (then KILL); 0 = none
# Everything else is read-only; system paths that root reads or runs are
# refused in write (docs/updo.md, "What bounds updo").

[global]
callers =
env     = TERM COLORTERM LANG LANGUAGE LC_*
timeout = 0

[identity updo]
# the everyday middle identity: a shell and any command, in the sandbox
shell    = yes
commands = *

# Examples:
#
# [identity web]
# callers  = master
# write    = /srv/www
# commands = /usr/bin/rsync /usr/bin/install /usr/bin/rm /usr/bin/ls
#
# [identity probe]
# user     = dynamic
# callers  = master
# commands = /usr/bin/ping /usr/bin/ss
# caps     = CAP_NET_RAW
# timeout  = 60
